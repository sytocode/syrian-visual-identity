<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>الصفحة غير موجودة | الهوية البصرية السورية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SPA redirect script for GitHub Pages -->
    <script>
      var l = window.location;
      var repoBase = '/syrian-visual-identity/';
      if (l.pathname.startsWith(repoBase)) {
        var cleanPath = l.pathname.slice(repoBase.length);
        var hashRoute = cleanPath.split('/')[0];
        if (['home', 'brand-story', 'brand-elements', 'tools', 'teams', 'downloads', 'ai-hub'].includes(hashRoute)) {
          l.replace(repoBase + '#' + hashRoute);
        } else {
          l.replace(repoBase);
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "IBM Plex Sans Arabic", sans-serif;
        background-color: #054239;
        color: #edebe0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        max-width: 480px;
        padding: 40px 24px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(185, 167, 121, 0.3);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .emblem {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        fill: #b9a779;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #d1d5db;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: #b9a779;
        color: #054239;
        font-weight: bold;
        text-decoration: none;
        border-radius: 12px;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 100 100" class="emblem">
        <path d="M50 8 L62 38 L95 38 L68 58 L78 90 L50 70 L22 90 L32 58 L5 38 L38 38 Z" />
      </svg>
      <h1>الصفحة غير موجودة | 404</h1>
      <p>عذراً، الرابط الذي تحاول الوصول إليه غير متاح أو تم نقله ضمن تحديثات المنصة الرسمية للهوية البصرية السورية.</p>
      <a href="/syrian-visual-identity/" class="btn">العودة إلى الصفحة الرئيسية</a>
    </div>
  </body>
</html>
